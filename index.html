<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>skhyv</title>
<meta name="description" content="Soon.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #060608;
    color: #d4d4dc;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3.5rem;
    text-align: center;
    padding: 2rem;
  }

  .line {
    font-size: clamp(0.85rem, 2.2vw, 1.1rem);
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: #6f6f7a;
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }

  #countdown {
    font-size: clamp(2.2rem, 9vw, 6rem);
    font-weight: 400;
    letter-spacing: 0.12em;
    color: #e8e8ee;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 40px rgba(180, 180, 220, 0.15);
  }

  .labels {
    display: flex;
    justify-content: center;
    gap: 0;
    font-size: clamp(0.55rem, 1.4vw, 0.7rem);
    letter-spacing: 0.3em;
    color: #3d3d46;
    text-transform: uppercase;
    margin-top: 0.75rem;
  }

  .cursor {
    display: inline-block;
    width: 0.6em;
    height: 1.1em;
    background: #6f6f7a;
    vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  #after {
    display: none;
    font-size: clamp(1rem, 3vw, 1.6rem);
    letter-spacing: 0.5em;
    color: #8a8a96;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="line">you were not supposed to find this yet</div>

  <div>
    <div id="countdown">--:--:--:--</div>
    <div class="labels" id="labels">days&nbsp;&nbsp;&middot;&nbsp;&nbsp;hours&nbsp;&nbsp;&middot;&nbsp;&nbsp;minutes&nbsp;&nbsp;&middot;&nbsp;&nbsp;seconds</div>
  </div>

  <div id="after">it has begun<span class="cursor"></span></div>

  <script>
    // 2026-07-17 16:00 UTC
    var target = Date.UTC(2026, 6, 17, 16, 0, 0);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('labels').style.display = 'none';
        document.getElementById('after').style.display = 'block';
        return;
      }
      var s = Math.floor(diff / 1000);
      var d = Math.floor(s / 86400);
      var h = Math.floor((s % 86400) / 3600);
      var m = Math.floor((s % 3600) / 60);
      var sec = s % 60;
      document.getElementById('countdown').textContent =
        pad(d) + ':' + pad(h) + ':' + pad(m) + ':' + pad(sec);
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();
  </script>
</body>
</html>
