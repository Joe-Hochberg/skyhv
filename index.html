<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKHYV</title>
<meta name="description" content="Your memory is the future.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #07070f;
    --panel: #12101f;
    --purple: #8b3dff;
    --purple-soft: #a06bff;
    --cyan: #35c9d9;
    --text-dim: #8a8a99;
    --text-dimmer: #55555f;
  }

  html { scroll-behavior: smooth; }

  body {
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(ellipse at 20% 10%, #16112a 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, #101726 0%, transparent 55%),
      var(--bg);
    background-size: 90px 90px, 90px 90px, 100% 100%, 100% 100%, 100% 100%;
    color: #e8e8ee;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    min-height: 100%;
  }

  /* ---------- HERO ---------- */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 1.5rem;
    gap: 2.2rem;
  }

  .logo {
    font-size: clamp(4rem, 16vw, 13rem);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 1;
    background: linear-gradient(100deg, #cdb6f2 0%, #8b3dff 28%, #5b5bf0 55%, #35a3d9 78%, #7fd4e4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(139, 61, 255, 0.25));
  }

  .tagline {
    font-size: clamp(0.9rem, 2.4vw, 1.35rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .date-chip {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.18em;
    color: var(--purple-soft);
    border: 1px solid rgba(139, 61, 255, 0.55);
    border-radius: 999px;
    padding: 0.5rem 1.4rem;
    background: rgba(139, 61, 255, 0.07);
    box-shadow: 0 0 18px rgba(139, 61, 255, 0.15);
  }

  .countdown {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(0.5rem, 2vw, 1.4rem);
    flex-wrap: wrap;
    margin-top: 0.8rem;
  }

  .unit { display: flex; flex-direction: column; gap: 0.9rem; align-items: center; }

  .card {
    width: clamp(4.6rem, 16vw, 9.5rem);
    height: clamp(5.2rem, 18vw, 10.2rem);
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #1a1428 0%, #0d0b18 100%);
    border: 1px solid rgba(139, 61, 255, 0.6);
    border-radius: 18px;
    box-shadow:
      0 0 24px rgba(139, 61, 255, 0.28),
      inset 0 0 30px rgba(139, 61, 255, 0.06);
    font-size: clamp(2.2rem, 8vw, 4.8rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: #f4efff;
    text-shadow: 0 0 22px rgba(160, 107, 255, 0.8);
  }

  .unit-label {
    font-size: 0.7rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 600;
  }

  .colon {
    font-size: clamp(1.2rem, 4vw, 2.4rem);
    color: var(--cyan);
    font-weight: 800;
    padding-bottom: 2.4rem;
    text-shadow: 0 0 12px rgba(53, 201, 217, 0.8);
  }

  .scroll-cue {
    margin-top: 2.5rem;
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 700;
  }
  .scroll-cue span.chev {
    color: var(--purple-soft);
    font-size: 1rem;
    animation: bob 1.8s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

  /* ---------- SIGNUP ---------- */
  .signup {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 640px;
    margin: 0 auto;
    padding: 5rem 1.5rem 6rem;
  }

  .kicker {
    font-size: 0.72rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--cyan);
    font-weight: 700;
    margin-bottom: 1rem;
  }

  .signup h2 {
    font-size: clamp(2rem, 6vw, 3.2rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 0.7rem;
  }

  .signup .sub {
    color: var(--text-dim);
    font-size: 1rem;
    margin-bottom: 2.5rem;
  }

  .form-card {
    background: linear-gradient(160deg, rgba(26,20,40,0.85) 0%, rgba(13,11,24,0.85) 100%);
    border: 1px solid rgba(139, 61, 255, 0.35);
    border-radius: 16px;
    padding: 2rem;
    box-shadow: 0 0 40px rgba(139, 61, 255, 0.12);
  }

  .field { margin-bottom: 1.4rem; }

  .field label {
    display: block;
    font-size: 0.68rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
    margin-bottom: 0.55rem;
  }

  .field input, .field select {
    width: 100%;
    background: rgba(10, 9, 18, 0.8);
    border: 1px solid rgba(139, 61, 255, 0.4);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    color: #e8e8ee;
    font-size: 0.95rem;
    outline: none;
    appearance: none;
  }
  .field input::placeholder { color: var(--text-dimmer); }
  .field select:invalid { color: var(--text-dimmer); }
  .field input:focus, .field select:focus {
    border-color: var(--purple-soft);
    box-shadow: 0 0 14px rgba(139, 61, 255, 0.35);
  }

  .submit-btn {
    width: 100%;
    margin-top: 0.4rem;
    padding: 1rem;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #7a2bf5 0%, #8b3dff 50%, #7a2bf5 100%);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 0 26px rgba(139, 61, 255, 0.55);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(139, 61, 255, 0.75); }

  .confirm {
    display: none;
    text-align: center;
    padding: 3rem 1rem;
  }
  .confirm .big {
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--purple-soft);
    text-shadow: 0 0 18px rgba(139, 61, 255, 0.6);
    margin-bottom: 0.9rem;
  }
  .confirm .small { color: var(--text-dim); font-size: 0.9rem; letter-spacing: 0.08em; }

  /* ---------- AFTER ZERO ---------- */
  #after {
    display: none;
    font-size: clamp(1.2rem, 4vw, 2rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--purple-soft);
    text-shadow: 0 0 24px rgba(139, 61, 255, 0.8);
  }
</style>
</head>
<body>

  <section class="hero">
    <div class="logo">SKHYV</div>
    <div class="tagline">Your memory is the future.</div>
    <div class="date-chip">JULY 17, 2026</div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="card" id="d">--</div><div class="unit-label">Days</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="card" id="h">--</div><div class="unit-label">Hours</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="card" id="m">--</div><div class="unit-label">Minutes</div></div>
      <div class="colon">:</div>
      <div class="unit"><div class="card" id="s">--</div><div class="unit-label">Seconds</div></div>
    </div>

    <div id="after">It has begun</div>

    <a class="scroll-cue" href="#access">Secure your spot <span class="chev">&#x2304;</span></a>
  </section>

  <section class="signup" id="access">
    <div class="kicker">Limited Access</div>
    <h2>Built for those who move first</h2>
    <div class="sub">Limited access. First come, first served.</div>

    <div class="form-card" id="form-card">
      <form id="access-form">
        <div class="field">
          <label for="name">Full Name</label>
          <input id="name" type="text" placeholder="Your name" autocomplete="off">
        </div>
        <div class="field">
          <label for="email">Email Address</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="off">
        </div>
        <div class="field">
          <label for="how">How did you hear about us?</label>
          <select id="how" required>
            <option value="" disabled selected>Select an option</option>
            <option>A dream</option>
            <option>The ticker tape</option>
            <option>Someone who moves first</option>
            <option>I was always going to end up here</option>
            <option>Typo</option>
          </select>
        </div>
        <button class="submit-btn" type="submit">Secure My Spot</button>
      </form>
      <div class="confirm" id="confirm">
        <div class="big">Your spot is secured.</div>
        <div class="small">Do not tell anyone. They will know when it is time.</div>
      </div>
    </div>
  </section>

  <script>
    // 2026-07-17 16:00 UTC
    var target = Date.UTC(2026, 6, 17, 16, 0, 0);

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) {
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('after').style.display = 'block';
        return;
      }
      var t = Math.floor(diff / 1000);
      document.getElementById('d').textContent = pad(Math.floor(t / 86400));
      document.getElementById('h').textContent = pad(Math.floor((t % 86400) / 3600));
      document.getElementById('m').textContent = pad(Math.floor((t % 3600) / 60));
      document.getElementById('s').textContent = pad(t % 60);
      setTimeout(tick, 1000 - (Date.now() % 1000));
    }
    tick();

    // Form: stores nothing, sends nothing. Pure theater.
    document.getElementById('access-form').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('access-form').style.display = 'none';
      document.getElementById('confirm').style.display = 'block';
    });
  </script>
</body>
</html>
